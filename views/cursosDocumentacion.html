</div>
<script>

    // ================================
    // MOSTRAR CAMPO OTROS
    // ================================

    const checkOtros =
        document.getElementById(
            'otrosCurso'
        );

    const divOtroCurso =
        document.getElementById(
            'otroCursoDiv'
        );

    checkOtros.addEventListener(
        'change',
        function () {

            if (this.checked) {

                divOtroCurso.style.display =
                    'block';

            } else {

                divOtroCurso.style.display =
                    'none';

            }

        }
    );

</script>
