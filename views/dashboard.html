    <script>

async function verificarSesion(){

    const respuesta = await fetch('/api/auth/session');

    if(respuesta.status !== 200){

        location.href='/login';

        return;

    }

    const usuario = await respuesta.json();

    if(!usuario || !usuario.id){

        location.href='/login';

    }

}

verificarSesion();

</script>

    <script>
        async function cargarPermisosDashboard() {

            const res = await fetch('/config-ui');
            const config = await res.json();
            const sesion = await fetch('/api/auth/session');

            const usuario = await sesion.json();

            const isAdmin = usuario.rol === 'admin';

            const setVisible = (modulo, estado) => {

                const el = document.querySelector(`[data-modulo="${modulo}"]`);

                if (!el) return;

                if (isAdmin) {

                    el.style.display = 'inline-block';

                    return;

                }

                el.style.display = estado ? 'inline-block' : 'none';

            };

            // AQUÍ PEGAS ESTO ↓↓↓

            setVisible('personal', config.registroPersonal);

            setVisible('buscar', config.buscarPersonal);

            setVisible('destinos', config.destinos);

            setVisible('vacaciones', config.vacaciones);

            setVisible('licencias', config.licencias);

            setVisible('bajas', config.bajas);

            setVisible('consulta', config.consultaGeneral);

            // Configuración solo para administradores
            setVisible('configuracion', false);
        }

        cargarPermisosDashboard();
        </script>
