<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Paso 3 - Datos Personales
    </title>

    <!-- ========================= -->
    <!-- ESTILOS -->
    <!-- ========================= -->

    <link rel="stylesheet" href="/css/sistema.css">
    <link rel="stylesheet" href="/css/layoutInstitucional.css">
    <link rel="stylesheet" href="/css/personal.css">
</head>

<body>
    <div class="logoUnidad">

        <img
            src="/images/escudo.jpeg"
            alt="Escudo Unidad">

    </div>
    <div class="contenedor">

        <h1 class="titulo">

            Registro de Personal

        </h1>

        <h3 class="paso">

            Paso 3 de 6 - Datos Personales

        </h3>

        <!-- ========================= -->
        <!-- BARRA DE PROGRESO -->
        <!-- ========================= -->

        <div class="progreso">

            <div
                class="progreso-barra"
                style="width:50%;">

                50%

            </div>

        </div>

        <form

            action="/personal/paso3"

            method="POST"

            enctype="multipart/form-data"

            class="formulario">

            <section class="seccion">

                <h2>

                    Datos Personales

                </h2>

                <!-- ========================= -->
                <!-- FILA 1 -->
                <!-- ========================= -->

                <div class="fila">

                    <div class="grupo">

                        <label>

                            Fecha de Nacimiento

                        </label>

                        <input
                            type="date"
                            name="fechaNacimiento"
                            required>

                    </div>

                    <div class="grupo">

                        <label>

                            Lugar de Nacimiento

                        </label>

                        <input
                            type="text"
                            name="lugarNacimiento">

                    </div>

                </div>

                <!-- ========================= -->
                <!-- FILA 2 -->
                <!-- ========================= -->

                <div class="fila">

                    <div class="grupo">

                        <label>

                            Departamento

                        </label>

                        <input
                            type="text"
                            name="departamento">

                    </div>

                    <div class="grupo">

                        <label>

                            Provincia

                        </label>

                        <input
                            type="text"
                            name="provincia">

                    </div>

                    <div class="grupo">

                        <label>

                            Localidad

                        </label>

                        <input
                            type="text"
                            name="localidad">

                    </div>

                </div>
                <!-- ========================= -->
                <!-- FILA 3 -->
                <!-- FOTOGRAFÍA -->
                <!-- ========================= -->

                <div class="fila">

                    <div class="grupo">

                        <label>

                            Fotografía

                        </label>

                        <input

                            type="file"

                            name="fotografia"

                            accept="image/*">

                    </div>

                </div>
            </section>

            <div class="botones">

                <button
                    type="submit"
                    class="btn btnSiguiente">

                    Siguiente →

                </button>

            </div>

            </div>

        </form>

    </div>

</body>

</html>
