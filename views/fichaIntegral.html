<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        Ficha Integral del Personal

    </title>

    <link rel="stylesheet"
          href="/css/fichaIntegral.css">

    <link
        rel="stylesheet"
        href="/css/layoutInstitucional.css">
</head>

<body>
    <div class="logoUnidad">

        <img
            src="/images/escudo.jpeg"
            alt="Escudo Unidad">

    </div>

    <div class="contenedor fichaIntegral">

        <!--============================-->
        <!-- CABECERA -->
        <!--============================-->

        <div id="cabeceraPersonal">

        </div>

        <!--============================-->
        <!-- DATOS MILITARES -->
        <!--============================-->

        <div class="bloqueFicha">

            <h3>

                DATOS MILITARES

            </h3>

            <div id="datosMilitares"></div>

        </div>

        </div>

        <!--============================-->
        <!-- DATOS PERSONALES -->
        <!--============================-->

        <div class="bloqueFicha">

            <h2>

                DATOS PERSONALES

            </h2>

            <div
                id="datosPersonales">

            </div>

        </div>

        <!--============================-->
        <!-- DATOS MÉDICOS -->
        <!--============================-->

        <div class="bloqueFicha">

            <h2>

                DATOS MÉDICOS

            </h2>

            <div
                id="datosMedicos">

            </div>

        </div>

        <!--============================-->
        <!-- FAMILIA Y CONTACTO -->
        <!--============================-->

        <div class="bloqueFicha">
            <h2>FAMILIA Y CONTACTO</h2>

            <div id="datosFamilia"></div>

        </div>

        <!--============================-->
        <!-- DESTINOS ANTERIORES -->
        <!--============================-->

        <div class="bloqueFicha">

            <h2>DESTINOS ANTERIORES</h2>

            <div id="datosDestinos"></div>

        </div>

        <!--============================-->
        <!-- VACACIONES -->
        <!--============================-->

        <div class="bloqueFicha">

            <h2>VACACIONES</h2>

            <div id="datosVacaciones"></div>

        </div>

        <!--============================-->
        <!-- LICENCIAS -->
        <!--============================-->

        <div class="bloqueFicha">

            <h2>LICENCIAS</h2>

            <div id="datosLicencias"></div>

        </div>

        <!--============================-->
        <!-- BAJAS MÉDICAS -->
        <!--============================-->

        <div class="bloqueFicha">

            <h2>BAJAS MÉDICAS</h2>

            <div id="datosBajas"></div>

        </div>

        <!--============================-->
        <!-- CURSOS Y DOCUMENTACIÓN -->
        <!--============================-->

        <div class="bloqueFicha">

            <h2>CURSOS Y DOCUMENTACIÓN</h2>

            <div id="datosCursos"></div>

        </div>



<script src="/js/fichaIntegral.js"></script>

</body>

</html>
