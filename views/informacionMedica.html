<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>

        Paso 5 - Información Médica

    </title>

    <!-- ========================= -->
    <!-- HOJA DE ESTILOS -->
    <!-- ========================= -->

    <link rel="stylesheet" href="/css/sistema.css">
    <link rel="stylesheet" href="/css/layoutInstitucional.css">
    <link rel="stylesheet" href="/css/personal.css">
</head>

<body>
    <div class="logoUnidad">

        <img
            src="/images/escudo.jpeg"
            alt="Escudo Unidad">

    </div>

    <div class="contenedor">

        <!-- ========================= -->
        <!-- TITULO -->
        <!-- ========================= -->

        <h1 class="titulo">

            Registro de Personal

        </h1>

        <h3 class="paso">

            Paso 5 de 6 - Información Médica

        </h3>

        <!-- ========================= -->
        <!-- BARRA DE PROGRESO -->
        <!-- ========================= -->

        <div class="progreso">

            <div
                class="progreso-barra"
                style="width:83%;">

                83%

            </div>

        </div>

        <!-- ========================= -->
        <!-- FORMULARIO -->
        <!-- ========================= -->

        <form
            action="/personal/paso5"
            method="POST"
            class="formulario">

            <!-- ========================= -->
            <!-- INFORMACIÓN MÉDICA -->
            <!-- ========================= -->

            <section class="seccion">

                <h2>

                    Información Médica

                </h2>

                <!-- ========================= -->
                <!-- FILA 1 -->
                <!-- ========================= -->

                <div class="fila">

                    <div class="grupo">

                        <label>

                            Grupo Sanguíneo

                        </label>

                        <select
                            name="grupoSanguineo">

                            <option value="">
                                Seleccione
                            </option>

                            <option>O+</option>
                            <option>O-</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>

                        </select>

                    </div>

                    <div class="grupo">

                        <label>

                            Alergias

                        </label>

                        <input
                            type="text"
                            name="alergias">

                    </div>

                </div>

                <!-- ========================= -->
                <!-- FILA 2 -->
                <!-- ========================= -->

                <div class="fila">

                    <div class="grupo">

                        <label>

                            Peso (Kg)

                        </label>

                        <input
                            type="number"
                            step="0.1"
                            name="peso">

                    </div>

                    <div class="grupo">

                        <label>

                            Estatura (Metros)

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="estatura">

                    </div>

                </div>

            </section>

            <!-- ========================= -->
            <!-- BOTÓN -->
            <!-- ========================= -->

            <div class="botones">

                <button
                    type="submit"
                    class="btn btnSiguiente">

                    Siguiente →

                    </button>

            </div>

        </form>

    </div>

</body>

</html>
